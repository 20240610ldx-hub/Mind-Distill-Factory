[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mind-distill-factory"
version = "0.1.0"
description = "Mind Distill Factory tools, including Debate Arena."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
debate-arena = "debate_arena.cli:main"

[tool.setuptools.packages.find]
include = ["debate_arena*"]

