[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mind-distill-factory"
version = "0.1.0"
description = "Mind Distill Factory tools, including Debate Arena."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
provenance = ["opencc-python-reimplemented>=0.1.7"]
pdf = [
    "PyMuPDF>=1.24",
    "pypdf>=4.0",
]
ocr = [
    "Pillow>=10.0",
    # rapidocr 3.x 自带 PP-OCRv6 中文模型，支持 Python 3.13；旧包 rapidocr_onnxruntime 只到 3.12，装了也认
    "rapidocr>=3.0",
    "onnxruntime>=1.17",
]
ocr-high-accuracy = [
    "PaddleOCR>=2.8",
]

[project.scripts]
debate-arena = "debate_arena.cli:main"

[tool.setuptools.packages.find]
include = ["debate_arena*"]

