arena:
  name: General Skill Debate Arena
  version: 0.1.0

input:
  participants_dir: ./debate_arena/skills
  # You can override the folder convention with explicit files:
  # skill_a_path: ./gallery/mao-zedong/SKILL.md
  # skill_b_path: ./gallery/richard-feynman/SKILL.md

runtime:
  language: zh-CN
  topic_mode: auto
  issue_count: 4
  word_limit: 600
  cross_exam_questions_each: 2
  enable_fact_check: false
  enable_judge: true
  llm_provider: openai

output:
  markdown_path: ./output/debate_arena/demo_debate.md
